<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Teacher Tiago — Gestão de alunos</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="bg"></div>
    <div class="app">
      <aside class="side">
        <div class="brand">
          <b>Teacher Tiago<i>.</i></b
          ><span>Gestão de alunos</span>
        </div>
        <nav class="nav" id="nav"></nav>
        <div class="side-foot">Aulas de inglês 100% online</div>
      </aside>
      <main id="main"><div class="loading">Carregando…</div></main>
    </div>
    <nav class="tabbar" id="tabbar"></nav>
    <div id="layer"></div>
    <div id="toastRoot"></div>
    <section id="login">
      <div class="glass login-card">
        <div class="brand">
          <b>Teacher Tiago<i>.</i></b
          ><span>Gestão de alunos</span>
        </div>
        <h1>Entrar</h1>
        <p class="sub" id="loginSub">Use o e-mail e a senha cadastrados para acessar a plataforma.</p>
        <form id="loginForm" novalidate>
          <label class="f">E-mail<input name="email" type="email" autocomplete="username" required /></label>
          <label class="f"
            >Senha<input name="senha" type="password" autocomplete="current-password" required
          /></label>
          <div class="login-err" id="loginErr" role="alert"></div>
          <button class="btn pri" type="submit" id="loginBtn">Entrar</button>
          <button class="login-link" type="button" id="forgotBtn">Esqueci minha senha</button>
        </form>
      </div>
    </section>

    <!-- Scripts (a ordem importa) -->
    <script src="js/config.js"></script>
    <script src="js/core/helpers.js"></script>
    <script src="js/core/state.js"></script>
    <script src="js/core/lessons.js"></script>
    <script src="js/core/payments.js"></script>
    <script src="js/ui/render.js"></script>
    <script src="js/ui/components.js"></script>
    <script src="js/views/dashboard.js"></script>
    <script src="js/views/alunos.js"></script>
    <script src="js/views/aluno.js"></script>
    <script src="js/views/calendario.js"></script>
    <script src="js/views/financeiro.js"></script>
    <script src="js/views/configuracoes.js"></script>
    <script src="js/ui/layer.js"></script>
    <script src="js/ui/forms.js"></script>
    <script src="js/ui/events.js"></script>
    <script src="js/data/backup.js"></script>
    <script src="js/data/local-db.js"></script>
    <script src="js/data/sync.js"></script>
    <script src="js/data/firebase.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
