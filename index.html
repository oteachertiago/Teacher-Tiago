"use strict";
/* Modo Firebase: login com e-mail/senha e banco Firestore na nuvem.
   Só é ativado quando js/config.js tem os dados do projeto Firebase. */

function lock(on) {
  document.body.classList.toggle("locked", on);
  if (on) {
    closeLayer();
    const e = $("#loginForm [name=email]");
    if (e && window.innerWidth > 860) setTimeout(() => e.focus(), 50);
  }
}

async function logout() {
  if (S.modo !== "firebase") return;
  try {
    await firebase.auth().signOut();
  } catch (e) {
    toast("Não foi possível sair.", true);
  }
}

/* Conta de aluno não entra no painel. As regras do Firestore já bloqueiam
   os dados; aqui a pessoa só recebe uma mensagem clara e o link do portal. */
async function abrirPainel(db, user) {
  let aluno = false;
  try {
    aluno = (await db.collection("usuarios").doc(user.uid).get()).exists;
  } catch (e) {}
  if (aluno || String(user.email || "").endsWith("@" + PORTAL_DOMINIO)) {
    stopSubs();
    resetData();
    S.db = null;
    S.noDb = true;
    S.noDbMsg = "Esta é uma conta de aluno. O painel de gestão é exclusivo do professor.";
    S.contaAluno = true;
    draw();
    return;
  }
  S.contaAluno = false;
  startSubs(db);
}

async function iniciarFirebase() {
  try {
    await carregarFirebase();
  } catch (e) {
    console.error(e);
    S.noDb = true;
    S.noDbMsg = "Não foi possível carregar o Firebase. Verifique a conexão com a internet.";
    draw();
    return;
  }
  const { db, auth } = iniciarApp();

  const form = $("#loginForm"),
    err = $("#loginErr"),
    btn = $("#loginBtn");
  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    err.textContent = "";
    const fd = new FormData(form);
    const email = String(fd.get("email") || "").trim(),
      senha = String(fd.get("senha") || "");
    if (!email || !senha) {
      err.textContent = !email ? "Digite seu e-mail." : "Digite a senha.";
      return;
    }
    btn.disabled = true;
    btn.textContent = "Entrando…";
    try {
      await auth.signInWithEmailAndPassword(email, senha);
      form.reset();
    } catch (e) {
      console.warn(e);
      err.textContent = authMsg(e);
    } finally {
      btn.disabled = false;
      btn.textContent = "Entrar";
    }
  });
  $("#forgotBtn").addEventListener("click", async () => {
    err.textContent = "";
    const email = String(form.elements.email.value || "").trim();
    if (!email) {
      err.textContent = "Digite seu e-mail acima e clique de novo em “Esqueci minha senha”.";
      return;
    }
    try {
      await auth.sendPasswordResetEmail(email);
      err.style.color = "var(--green)";
      err.textContent = "Se o e-mail estiver cadastrado, você vai receber um link para criar uma nova senha.";
      setTimeout(() => {
        err.style.color = "";
      }, 6000);
    } catch (e) {
      err.textContent = authMsg(e);
    }
  });

  auth.onAuthStateChanged((user) => {
    S.user = user || null;
    if (user) {
      lock(false);
      abrirPainel(db, user);
    } else {
      stopSubs();
      resetData();
      S.db = null;
      lock(true);
      $("#main").innerHTML = '<div class="loading">Carregando…</div>';
    }
  });
}


/* ============================== js/data/portal-acesso.js ============================== */
"use strict";
/* Painel: criar, copiar e remover o acesso de um aluno ao Portal do Aluno.

   Como funciona:
   - Cada aluno ganha uma conta no Firebase Authentication. O login é o
     nome de usuário (ex.: "João Silva"), convertido num e-mail interno
     (joao.silva@alunos.oteachertiago.app). A senha inicial é o WhatsApp
     cadastrado, só com números. O aluno troca no primeiro acesso.
   - A coleção "usuarios" liga a conta (uid) ao cadastro do aluno.
     As regras do Firestore usam esse vínculo para liberar só os dados dele.
   - Remover o acesso apaga esse vínculo: a conta continua existindo no
     Authentication, mas não enxerga mais nada. */

const acessosDoAluno = (aid) => Object.entries(S.usuarios || {}).filter(([, u]) => u.alunoId === aid);
const portalUrl = () => new URL("aluno.html", location.href).href;

function cardPortal(id, a) {
  const head = `<div class="sec-title"><h2>Portal do aluno</h2></div>`;
  if (S.modo !== "firebase")
    return `<section class="glass sec">${head}<p class="muted" style="margin:0">O acesso individual dos alunos funciona no modo nuvem. Configure o Firebase para liberar o Portal do Aluno.</p></section>`;
  const ac = acessosDoAluno(id)[0];
  if (!ac)
    return `<section class="glass sec">${head}<p class="muted" style="margin:0 0 12px">${esc(first(a.nome))} ainda não tem acesso. Ao criar, o usuário é o nome dele e a senha inicial é o WhatsApp cadastrado.</p>
      <button class="btn pri sm" data-act="acesso-criar" data-id="${id}">${I.plus}Criar acesso</button></section>`;
  const u = ac[1];
  const st = u.senhaTrocada ? bdg("ativo", "Ativo") : bdg("pendente", "Aguardando primeiro acesso");
  return `<section class="glass sec">${head}<div class="kv" style="margin-bottom:14px">
      <div><small>Usuário</small>${esc(u.usuario)}</div>
      <div><small>Situação</small>${st}</div>
      <div><small>Senha inicial</small>${u.senhaTrocada ? '<span class="dim">Já foi trocada pelo aluno</span>' : "WhatsApp, só números"}</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm pri" data-act="acesso-copiar" data-id="${id}">Copiar convite</button><button class="btn sm danger" data-act="acesso-remover" data-id="${id}">Remover acesso</button></div>
    <p class="hint">Se o aluno esquecer a senha: remova o acesso, apague a conta dele em Firebase → Authentication → Usuários e crie o acesso de novo.</p></section>`;
}

function acessoForm(aid) {
  const a = S.alunos[aid];
  const tel = digitos(a.whatsapp);
  openModal(
    `<form id="acessoForm" data-aid="${aid}"><div class="m-h"><h2>Criar acesso ao portal</h2><button type="button" class="x" data-act="close">${I.x}</button></div>
  <div class="m-b"><div class="fg">
  ${field("Usuário", `<input name="usuario" required value="${esc(a.nome)}" autocomplete="off">`, "full")}
  </div>
  <p class="hint">É com esse nome que ${esc(first(a.nome))} entra no portal. Maiúsculas e acentos não fazem diferença.</p>
  <div class="kv" style="margin-top:14px"><div><small>Senha inicial</small>${tel.length >= 6 ? esc(tel) + ' <span class="dim">(WhatsApp, só números)</span>' : '<span style="color:var(--red-t)">Cadastre o WhatsApp do aluno antes de criar o acesso.</span>'}</div></div></div>
  <div class="m-f"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn pri" type="submit" ${tel.length >= 6 ? "" : "disabled"}>Criar acesso</button></div></form>`,
    "sm",
  );
}

async function salvarAcesso(f, fd) {
  const aid = f.dataset.aid;
  const a = S.alunos[aid];
  const usuario = String(fd.get("usuario") || "").trim();
  const email = usuarioParaEmail(usuario);
  const senha = digitos(a.whatsapp);
  if (!email) return toast("Digite um nome de usuário.", true);
  if (senha.length < 6) return toast("Cadastre o WhatsApp do aluno antes de criar o acesso.", true);
  const igual = Object.entries(S.usuarios || {}).find(
    ([, u]) => usuarioParaEmail(u.usuario) === email && u.alunoId !== aid,
  );
  if (igual) return toast("Esse usuário já é de outro aluno. Use, por exemplo, o nome com sobrenome.", true);

  // Cria a conta numa instância separada do Firebase, para não desconectar o professor.
  const app =
    firebase.apps.find((x) => x.name === "cadastro") ||
    firebase.initializeApp(APP_CONFIG.firebase, "cadastro");
  const auth2 = app.auth();
  try {
    await auth2.setPersistence(firebase.auth.Auth.Persistence.NONE);
  } catch (e) {}
  let uid = null;
  try {
    uid = (await auth2.createUserWithEmailAndPassword(email, senha)).user.uid;
  } catch (e) {
    if (e && e.code === "auth/email-already-in-use") {
      // A conta já existia (acesso removido antes): reaproveita se a senha ainda for a inicial.
      try {
        uid = (await auth2.signInWithEmailAndPassword(email, senha)).user.uid;
      } catch (e2) {
        toast(
          "Já existe uma conta com esse usuário. Escolha outro nome ou apague a conta antiga no Firebase → Authentication.",
          true,
        );
        return;
      }
    } else {
      console.error(e);
      toast(authMsg(e), true);
      return;
    }
  } finally {
    try {
      await auth2.signOut();
    } catch (e) {}
  }
  const outro = S.usuarios[uid];
  if (outro && outro.alunoId !== aid) {
    toast("Esse usuário já pertence a outro aluno.", true);
    return;
  }
  const ok = await W(
    () =>
      coll("usuarios").doc(uid).set({
        alunoId: aid,
        usuario,
        nome: a.nome,
        criadoEm: today(),
        senhaTrocada: false,
      }),
    "Acesso criado",
  );
  if (ok) {
    closeLayer();
    draw();
  }
}

async function copiarConvite(aid) {
  const a = S.alunos[aid];
  const ac = acessosDoAluno(aid)[0];
  if (!ac) return;
  const u = ac[1];
  const txt =
    `Olá, ${first(a.nome)}! Sua Área do Aluno do Teacher Tiago está pronta.\n\n` +
    `Acesse: ${portalUrl()}\n` +
    `Usuário: ${u.usuario}\n` +
    (u.senhaTrocada
      ? `Senha: a que você criou no primeiro acesso.\n`
      : `Senha inicial: seu WhatsApp, só números (${digitos(a.whatsapp)})\n\nNo primeiro acesso você vai criar uma senha nova.\n`) +
    `\nLá você encontra suas aulas, o link para entrar, os materiais e o financeiro.`;
  let ok = false;
  try {
    await navigator.clipboard.writeText(txt);
    ok = true;
  } catch (e) {
    const t = document.createElement("textarea");
    t.value = txt;
    t.style.position = "fixed";
    t.style.opacity = "0";
    document.body.appendChild(t);
    t.select();
    try {
      ok = document.execCommand("copy");
    } catch (e2) {}
    t.remove();
  }
  toast(ok ? "Convite copiado. Cole no WhatsApp do aluno." : "Não foi possível copiar.", !ok);
}

function removerAcesso(aid) {
  const a = S.alunos[aid];
  confirmBox(
    "Remover acesso de " + first(a.nome) + "?",
    "O aluno deixa de entrar no portal imediatamente. Os dados dele continuam salvos no painel.",
    "Remover acesso",
    async () => {
      for (const [uid] of acessosDoAluno(aid)) await W(() => coll("usuarios").doc(uid).delete());
      toast("Acesso removido");
      closeLayer();
      draw();
    },
  );
}


/* ============================== js/main.js ============================== */
"use strict";
/* Inicialização: escolhe o banco (Firebase ou local) e abre a plataforma. */

(async () => {
  route();
  if (firebaseConfigurado()) {
    S.modo = "firebase";
    await iniciarFirebase();
  } else {
    S.modo = "local";
    startSubs(LocalDB);
  }
})();
